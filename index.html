<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- NO viewport-fit=cover. With it, the layout viewport extends UNDER Android's
       system navigation bar (and any notch), so the bottom nav + every bottom-anchored
       sheet renders behind it and the page gains phantom scroll. We have no edge-to-edge
       artwork to gain from cover, and the default (contain) insets the viewport to the
       safe area automatically — which fixes all ~16 bottom-anchored elements at once
       without a single env(safe-area-inset-*) anywhere. Only reintroduce cover together
       with safe-area padding on every one of them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F3F0E9" />
  <title>Papaya</title>
  <link rel="manifest" href="/manifest.json" />
  <!-- iOS ignores the manifest's icons for Add to Home Screen; without this it
       uses a screenshot of the page instead. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
